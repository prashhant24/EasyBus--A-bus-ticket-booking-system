<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyBus | Bill</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="https://cdn-icons-png.flaticon.com/512/61/61231.png" class="logo">
    <h3>EasyBus</h3>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="booking.html">Book Ticket</a>
    <a href="tatkal.html">Tatkal</a>
    <a href="login.html">Login</a>

    <div class="login-visual" style="height:140px;">
        <img src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=800" alt="EasyBus" style="height:140px;">

    <h2>Booking Bill / Receipt</h2>
    <p class="muted" style="text-align:center; margin-top:-6px;">
      Please save this for travel. You can print it anytime.
    </p>

    <div id="billBox" class="receipt"></div>

    <div class="actions" style="justify-content:center;">
      <button type="button" id="printBtn">Print</button>
      <a href="booking.html"><button type="button" class="btn-secondary">Book Another</button></a>
      <button type="button" id="clearBtn" class="btn-secondary">Clear Saved Bill</button>
    </div>
  </div>

  <script src="script.js"></script>
